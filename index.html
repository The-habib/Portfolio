    <script>
      function reportError(type, payload) {
        fetch('/api/client-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: type, payload: payload })
        }).catch(function(){});
      }
      window.addEventListener('error', function(e) {
        reportError('error', { message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno, stack: e.error ? e.error.stack : null });
      });
      window.addEventListener('unhandledrejection', function(e) {
        reportError('unhandledrejection', { reason: e.reason && e.reason.message ? e.reason.message : String(e.reason), stack: e.reason && e.reason.stack ? e.reason.stack : null });
      });
    </script>
